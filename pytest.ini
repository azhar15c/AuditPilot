[pytest]
markers =
    workstream_a: Supervisor node tests
    workstream_b: extraction/retrieval/classification agent tests
    workstream_c: fan-out/subgraph wiring tests
    workstream_d: critic agent tests
    fanout_concurrency: parallel execution timing/correctness tests
    tool_boundary: agent least-privilege enforcement tests
    critic_disagreement: synthetic Critic disagreement cases
    retrieval_convergence: iterative retrieval loop tests
